name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web:
    name: Versión web (se actualiza sola)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar proyecto web
        run: |
          flutter create --org com.cesar.juegos --project-name pareme_la_mano --platforms=web _genweb
          cp -r _genweb/web web
          rm -rf _genweb
          # La canción con derechos de autor NO se publica en la web
          rm -f assets/music/quito_fiestas.*
          cp web_assets/icons/*.png web/icons/
          cp web_assets/favicon.png web/favicon.png
          cp web_assets/update.js web/update.js
          sed -i 's#<title>[^<]*</title>#<title>Noche de juegos</title>#' web/index.html
          sed -i 's#</body>#<script src="update.js"></script></body>#' web/index.html
          sed -i -E 's/"name": "[^"]*"/"name": "Noche de juegos"/; s/"short_name": "[^"]*"/"short_name": "Noche de juegos"/; s/"background_color": "[^"]*"/"background_color": "#5E35B1"/; s/"theme_color": "[^"]*"/"theme_color": "#5E35B1"/' web/manifest.json

      - run: flutter pub get
      - run: flutter build web --release --base-href /pareme-la-mano/

      - name: Marcar versión
        run: |
          echo "${{ github.sha }}" > build/web/build_id.txt
          sed -i "s/__BUILD_ID__/${{ github.sha }}/" build/web/update.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar proyecto Android
        run: |
          flutter create --org com.cesar.juegos --project-name pareme_la_mano --platforms=android _gen
          cp -r _gen/android android
          rm -rf _gen
          # Firebase exige minSdk 23
          sed -i -E 's/minSdk\s*=\s*flutter\.minSdkVersion/minSdk = 23/; s/minSdkVersion\s+flutter\.minSdkVersion/minSdkVersion 23/' android/app/build.gradle* || true
          # Bloquea la pantalla dividida (anti-trampa)
          sed -i 's/<activity/<activity android:resizeableActivity="false"/' android/app/src/main/AndroidManifest.xml
          # Nombre visible de la app
          sed -i -E 's/android:label="[^"]*"/android:label="Noche de juegos"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - name: Analizar código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Pruebas del motor de ajedrez
        run: dart run tool/perft.dart
      - name: Pruebas del motor de La Galleta
        run: dart run tool/galleta_test.dart
      - name: Pruebas de Encuentra los pares
        run: dart run tool/pares_test.dart
      - name: Pruebas del Bingo
        run: dart run tool/bingo_test.dart
      - name: Pruebas de penales
        run: dart run tool/penales_test.dart
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: apk-noche-de-juegos
          path: build/app/outputs/flutter-apk/app-release.apk
